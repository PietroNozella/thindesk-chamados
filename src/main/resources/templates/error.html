<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Não foi possível abrir a página | Thindesk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <main class="container mt-5" style="max-width: 640px">
        <h1 th:text="${status == 404 ? 'Página ou registro não encontrado' : (status == 410 ? 'Link de recuperação desativado' : 'Não foi possível concluir a solicitação')}"></h1>
        <p th:if="${status == 404}">O endereço pode estar incorreto ou o registro não existe mais.</p>
        <p th:if="${status == 410}">Solicite a recuperação de acesso ao administrador da instituição.</p>
        <p th:if="${status != 404 and status != 410}">Volte à lista de chamados e tente novamente. Se o problema continuar, procure o administrador.</p>
        <a th:href="@{/chamados}" class="btn btn-primary">Voltar aos chamados</a>
    </main>
</body>
</html>
