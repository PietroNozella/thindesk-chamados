<section th:fragment="content" xmlns:th="http://www.thymeleaf.org">
    <h1>Auditoria</h1>
    <p class="text-muted">Autenticação, acessos negados e alterações de acesso. Consulta restrita ao administrador.</p>
    <div class="table-responsive">
        <table class="table table-striped">
            <thead><tr><th scope="col">Quando</th><th scope="col">Usuário</th><th scope="col">Ação</th>
                <th scope="col">Resultado</th><th scope="col">Registro</th><th scope="col">IP</th></tr></thead>
            <tbody><tr th:each="registro : ${registros}">
                <td th:text="${registro.quando}"></td><td th:text="${registro.usuario}"></td><td th:text="${registro.acao}"></td>
                <td th:text="${registro.resultado}"></td><td th:text="${registro.entidadeId}"></td><td th:text="${registro.ip}"></td>
            </tr></tbody>
        </table>
    </div>
</section>
