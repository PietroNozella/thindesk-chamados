<section th:fragment="content" xmlns:th="http://www.thymeleaf.org">
    <h1>Cadastrar usuário</h1>
    <p class="text-muted">Crie uma conta e atribua um perfil de acesso.</p>
    <div th:if="${ok}" class="alert alert-success" role="status" th:text="${ok}"></div>
    <form th:action="@{/usuarios/novo}" th:object="${cadastro}" method="post" class="card card-body ticket-form">
        <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger" role="alert">
            <ul class="mb-0"><li th:each="erro : ${#fields.allErrors()}" th:text="${erro}"></li></ul>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3"><label for="nome" class="form-label">Nome</label>
                <input id="nome" th:field="*{nome}" autocomplete="given-name" class="form-control" required maxlength="150"></div>
            <div class="col-md-6 mb-3"><label for="sobrenome" class="form-label">Sobrenome</label>
                <input id="sobrenome" th:field="*{sobrenome}" autocomplete="family-name" class="form-control" required maxlength="150"></div>
        </div>
        <div class="mb-3"><label for="email" class="form-label">E-mail</label>
            <input id="email" type="email" th:field="*{email}" autocomplete="email" class="form-control" required maxlength="254"></div>
        <div class="mb-3"><label for="username" class="form-label">Nome de usuário</label>
            <input id="username" th:field="*{username}" autocomplete="username" class="form-control" required maxlength="150" pattern="[A-Za-z0-9._-]+"
                   aria-describedby="usuario-ajuda"><div id="usuario-ajuda" class="form-text">Use letras sem acento, números, ponto, hífen ou sublinhado.</div></div>
        <div class="mb-3"><label for="perfil" class="form-label">Perfil</label>
            <select id="perfil" th:field="*{perfil}" class="form-select" required>
                <option value="">Selecione</option><option th:each="perfil : ${perfis}" th:value="${perfil}" th:text="${perfil}"></option>
            </select></div>
        <div class="mb-3"><label for="senha" class="form-label">Senha inicial (mínimo de 8 caracteres)</label>
            <input id="senha" name="senha" type="password" autocomplete="new-password" class="form-control" required minlength="8" maxlength="72"></div>
        <div class="d-flex gap-2"><button type="submit" class="btn btn-primary">Cadastrar usuário</button>
            <a th:href="@{/usuarios}" class="btn btn-outline-secondary">Voltar</a></div>
    </form>
</section>
