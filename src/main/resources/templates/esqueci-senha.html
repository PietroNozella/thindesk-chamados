<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex"><title>Recuperar acesso | Thindesk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
    <main class="container py-5" style="max-width: 560px">
        <div class="card card-body">
            <h1 class="h3">Recuperar acesso</h1>
            <p>Solicite a redefinição da senha ao administrador da instituição. Ele deverá confirmar sua identidade e informar uma nova senha por um canal privado.</p>
            <p class="text-muted">Depois de entrar, você pode escolher outra senha em Trocar senha.</p>
            <a th:href="@{/login}" class="btn btn-primary">Voltar ao login</a>
        </div>
    </main>
</body>
</html>
