<section th:fragment="content" xmlns:th="http://www.thymeleaf.org"
         xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <header class="d-flex flex-wrap gap-3 justify-content-between align-items-center mb-4">
        <div><h1>Chamados</h1><p class="text-muted mb-0">Registre e acompanhe as solicitações de atendimento.</p></div>
        <a th:href="@{/chamados/novo}" class="btn btn-primary"
           sec:authorize="hasAnyRole('ADMINISTRADOR', 'OPERADOR')">Novo chamado</a>
    </header>
    <div th:if="${ok}" class="alert alert-success" role="status" th:text="${ok}"></div>
    <div th:if="${erro}" class="alert alert-warning" role="alert" th:text="${erro}"></div>
    <div th:if="${#lists.isEmpty(chamados)}" class="alert alert-info">Nenhum chamado cadastrado.</div>
    <div class="table-responsive" th:unless="${#lists.isEmpty(chamados)}">
        <table class="table table-striped align-middle">
            <caption>Chamados registrados no sistema.</caption>
            <thead><tr>
                <th scope="col">Descrição</th><th scope="col">Status</th><th scope="col">Tipo</th>
                <th scope="col">Técnico</th><th scope="col">Solicitante</th>
                <th scope="col" sec:authorize="hasAnyRole('ADMINISTRADOR', 'OPERADOR')">Ações</th>
            </tr></thead>
            <tbody><tr th:each="chamado : ${chamados}">
                <td class="ticket-description" th:text="${chamado.descricao}"></td>
                <td th:text="${statusDisponiveis.getOrDefault(chamado.status, chamado.status)}"></td>
                <td th:text="${chamado.tipo}"></td>
                <td th:text="${#strings.isEmpty(chamado.tecnico) ? 'Não atribuído' : chamado.tecnico}"></td>
                <td th:text="${chamado.usuario}"></td>
                <td sec:authorize="hasAnyRole('ADMINISTRADOR', 'OPERADOR')">
                    <div class="d-flex flex-wrap gap-2">
                        <a th:href="@{/chamados/atualizar/{id}(id=${chamado.id})}" class="btn btn-outline-primary btn-sm">Editar</a>
                        <form th:if="${chamado.status != 'CANCELADO'}"
                              th:action="@{/chamados/cancelar/{id}(id=${chamado.id})}" method="post"
                              onsubmit="return confirm('Cancelar este chamado? O registro será mantido.');">
                            <input type="hidden" name="revisao" th:value="${chamado.revisao}">
                            <button type="submit" class="btn btn-outline-danger btn-sm">Cancelar</button>
                        </form>
                    </div>
                </td>
            </tr></tbody>
        </table>
    </div>
</section>
