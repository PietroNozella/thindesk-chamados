spring.application.name=thindesk-chamados
server.port=${SERVER_PORT:8082}

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27020/thindesk_chamados}
spring.data.mongodb.database=${MONGODB_DATABASE:thindesk_chamados}
spring.data.mongodb.auto-index-creation=true

# O login é o identificador estável do solicitante nos chamados.
spring.security.user.name=${THINDESK_USERNAME}
spring.security.user.password=${THINDESK_PASSWORD}
thindesk.security.tecnico.username=${THINDESK_TECNICO_USERNAME:tecnico}
thindesk.security.tecnico.password=${THINDESK_TECNICO_PASSWORD}

server.error.include-message=never
server.error.include-stacktrace=never
logging.level.com.pfc=INFO
