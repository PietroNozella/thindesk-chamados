spring.application.name=thindesk-chamados
server.port=${SERVER_PORT:8082}

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27020/thindesk_chamados}
spring.data.mongodb.database=${MONGODB_DATABASE:thindesk_chamados}
spring.data.mongodb.auto-index-creation=true

# Configuração de usuário da base original, reservada à próxima feature.
spring.security.user.name=${THINDESK_USERNAME}
spring.security.user.password=${THINDESK_PASSWORD}

server.error.include-message=never
server.error.include-stacktrace=never
logging.level.com.pfc=INFO
