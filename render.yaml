services:
  - type: web
    name: thindesk-chamados
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    healthCheckPath: /esqueci-senha
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: thindesk
      - key: APP_ADMIN_USERNAME
        sync: false
      - key: APP_ADMIN_PASSWORD
        sync: false
      - key: APP_ADMIN_EMAIL
        sync: false
      - key: SERVER_FORWARD_HEADERS_STRATEGY
        value: framework
      - key: SERVER_SERVLET_SESSION_COOKIE_SECURE
        value: "true"
      - key: SPRING_THYMELEAF_CACHE
        value: "true"
